# Done to increase the memory available to Gradle.
    org.gradle.jvmargs = -Xmx2G
    org.gradle.parallel = true

# Mod properties
    mod_version = 0.1.0
    maven_group = me.jaffe2718
    archives_name = mcmti-dashscope-plugin
    enabled_platforms = fabric,neoforge

# Minecraft properties
    minecraft_version = 1.21
    yarn_mappings = 1.21+build.1
    yarn_mappings_patch_neoforge_version = 1.21+build.6

# Dependent Mods
    architectury_api_version = 13.0.8
    fabric_loader_version = 0.18.4
    fabric_api_version = 0.102.0+1.21
    neoforge_version = 21.0.167
    midnightlib_version = 1.9.2+1.21.1

# mcmti (fork with SpeechAsrClientPlugin SPI) — published on jitpack.
# Apply mcmti-patches/ to your fork first, push to GitHub, and jitpack will build it.
# Coordinates split into group/artifact/version so each platform subproject
# can reference the same fork.
    mcmti_jitpack_group = com.github.link-fgfgui
    mcmti_jitpack_artifact = Microphone-Text-Input-Online
    mcmti_version = 2.x-1.21-SNAPSHOT

# DashScope SDK (paraformer-realtime-v2 via WebSocket streaming)
    dashscope_sdk_version = 2.22.24

# Compatibility ranges (for mod metadata templates)
    compatibility_mc_versions = >=1.21
    compatibility_fabricloader_versions = >=0.16.0
    compatibility_midnightlib_versions = >=1.9.0
    mc_versionRange = [1.21,)
    neoforge_versionRange = [21,)
    architectury_versionRange = [13,)
