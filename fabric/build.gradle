plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "maven.modrinth:midnightlib:${midnightlib_version}-fabric"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    modCompileOnly "me.jaffe2718:mcmti-common:3.0.0"

    // DashScope SDK + transitive deps bundled as Fabric JiJ (nested jars).
    // Fabric Loader deduplicates against MC-bundled gson/slf4j automatically.
    // MUST list each transitive dep explicitly — include() does NOT pull
    // transitive deps of the included artifact, only the artifact itself.
    // Gson is NOT included (Minecraft 1.20.1 ships gson already).
    modImplementation include("com.alibaba:dashscope-sdk-java:${dashscope_sdk_version}")
    modImplementation include("com.squareup.okhttp3:okhttp:4.12.0")
    modImplementation include("com.squareup.okhttp3:okhttp-sse:4.12.0")
    modImplementation include("com.squareup.okhttp3:logging-interceptor:4.12.0")
    modImplementation include("com.squareup.okio:okio:3.6.0")
    modImplementation include("io.reactivex.rxjava2:rxjava:2.2.21")
    modImplementation include("org.reactivestreams:reactive-streams:1.0.3")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

processResources {
    inputs.property 'version', project.version
}
