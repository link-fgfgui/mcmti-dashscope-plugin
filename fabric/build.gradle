plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "maven.modrinth:midnightlib:${rootProject.midnightlib_version}-fabric"

    modCompileOnly "me.jaffe2718:mcmti-common:3.0.0"
    // At runtime the user's mcmti-fabric jar provides them.

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // DashScope SDK + transitive deps bundled as Fabric JiJ (nested jars).
    // Fabric Loader deduplicates against MC-bundled gson/slf4j automatically.
    // MUST list each transitive dep explicitly — include() does NOT pull
    // transitive deps of the included artifact, only the artifact itself.
    // Gson is NOT included (Minecraft 1.21 ships gson 2.10.1 already).
    modImplementation include("com.alibaba:dashscope-sdk-java:$rootProject.dashscope_sdk_version")
    modImplementation include("com.squareup.okhttp3:okhttp:4.12.0")
    modImplementation include("com.squareup.okhttp3:okhttp-sse:4.12.0")
    modImplementation include("com.squareup.okhttp3:logging-interceptor:4.12.0")
    modImplementation include("com.squareup.okio:okio:3.6.0")
    modImplementation include("io.reactivex.rxjava2:rxjava:2.2.21")
    modImplementation include("org.reactivestreams:reactive-streams:1.0.3")
}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "compatibility_fabricloader_versions": project.compatibility_fabricloader_versions,
                "compatibility_mc_versions": project.compatibility_mc_versions,
                "compatibility_midnightlib_versions": project.compatibility_midnightlib_versions
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveFileName = "${rootProject.archives_name}-${rootProject.version}+${project.minecraft_version}-fabric.jar"
}
