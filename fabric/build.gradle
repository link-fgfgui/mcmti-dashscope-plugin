plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "maven.modrinth:midnightlib:${rootProject.midnightlib_version}-fabric"

    // mcmti SPI classes come transitively from :common (compileOnly).
    // At runtime the user's mcmti-fabric jar provides them.

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // DashScope SDK + transitive deps bundled as Fabric JiJ (nested jars).
    // Fabric Loader deduplicates against MC-bundled gson/slf4j automatically.
    modImplementation include("com.alibaba:dashscope-sdk-java:$rootProject.dashscope_sdk_version")
}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "compatibility_fabricloader_versions": project.compatibility_fabricloader_versions,
                "compatibility_mc_versions": project.compatibility_mc_versions,
                "compatibility_midnightlib_versions": project.compatibility_midnightlib_versions
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveFileName = "${rootProject.archives_name}-${rootProject.version}+${project.minecraft_version}-fabric.jar"
}
