architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Fabric Loader for @Environment annotations (remapped per-platform)
    modCompileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // mcmti SPI interfaces — pure-Java jar published from the mcmti fork's
    // root project (see mcmti-patches/build.gradle). Plain compileOnly (not
    // modCompileOnly) because the SPI jar has no minecraft/loom dependency.
    // At runtime the same classes are provided by the mcmti mod jar; plugin
    // mods must NOT bundle them.
    compileOnly "${rootProject.mcmti_jitpack_group}:${rootProject.mcmti_jitpack_artifact}:${rootProject.mcmti_version}"

    // DashScope SDK — compile against, bundle per-platform via JiJ
    compileOnly "com.alibaba:dashscope-sdk-java:$rootProject.dashscope_sdk_version"

    // SLF4J API — runtime provided by Minecraft loader; compile-only here so
    // plugin logs route through log4j2 (java.util.logging is NOT bridged by
    // default and would be silently dropped from debug.log).
    compileOnly 'org.slf4j:slf4j-api:2.0.16'

    modCompileOnly "maven.modrinth:midnightlib:${rootProject.midnightlib_version}-fabric"
}
