plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'

    // mcmti provides the SpeechRecognizer API this plugin implements (resolved locally from ./libs).
    compileOnly "me.jaffe2718:mcmti-common:3.0.0"

    // MidnightLib provides the config screen/API used by the plugin config.
    // The Forge variant is used as the common compile-time reference (the
    // common module compiles against Mojang mappings via legacyforge); the
    // loader modules pick the artifact matching their own loader.
    modCompileOnly "maven.modrinth:midnightlib:${midnightlib_version}-forge"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
