plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    modImplementation "maven.modrinth:midnightlib:${midnightlib_version}-forge"
    modCompileOnly "me.jaffe2718:mcmti-common:3.0.0"

    // The mcmti mod provides the SpeechRecognizer API at runtime. It is a
    // mandatory dependency (see mods.toml), so the dev client needs it on the
    // classpath. Declared as a mod dependency so ModDev remaps the production
    // (SRG) jar to the dev mappings. Resolved from the local ./libs flatDir.
    modRuntimeOnly "me.jaffe2718:mcmti-forge:${minecraft_version}-3.0.0"
}

tasks.named('runClient') {
    jvmArgs '-Djava.awt.headless=false'
}
